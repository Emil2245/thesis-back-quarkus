[versions]
quarkus = "3.40.1.1"
poi = "6.0.0"
openpdf = "2.0.3"
pdfbox = "3.0.8"
jqwik = "1.10.2"
commons-csv = "1.14.1"
jackson-databind-nullable = "0.2.12"
spotless = "8.10.4"

[libraries]
# Platform BOM
quarkus-platform-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }

# Framework (BOM-managed, no version here)
quarkus-hibernate-orm-panache = { module = "io.quarkus:quarkus-hibernate-orm-panache" }
quarkus-rest = { module = "io.quarkus:quarkus-rest" }
quarkus-rest-jackson = { module = "io.quarkus:quarkus-rest-jackson" }
quarkus-smallrye-health = { module = "io.quarkus:quarkus-smallrye-health" }
quarkus-micrometer-registry-prometheus = { module = "io.quarkus:quarkus-micrometer-registry-prometheus" }
quarkus-opentelemetry = { module = "io.quarkus:quarkus-opentelemetry" }
quarkus-logging-json = { module = "io.quarkus:quarkus-logging-json" }
quarkus-smallrye-jwt-build = { module = "io.quarkus:quarkus-smallrye-jwt-build" }
quarkus-hibernate-validator = { module = "io.quarkus:quarkus-hibernate-validator" }
quarkus-smallrye-jwt = { module = "io.quarkus:quarkus-smallrye-jwt" }
quarkus-security-jpa = { module = "io.quarkus:quarkus-security-jpa" }
quarkus-flyway = { module = "io.quarkus:quarkus-flyway" }
quarkus-smallrye-openapi = { module = "io.quarkus:quarkus-smallrye-openapi" }
quarkus-jdbc-postgresql = { module = "io.quarkus:quarkus-jdbc-postgresql" }
quarkus-config-yaml = { module = "io.quarkus:quarkus-config-yaml" }
quarkus-arc = { module = "io.quarkus:quarkus-arc" }
quarkus-elytron-security-common = { module = "io.quarkus:quarkus-elytron-security-common" }

# App libraries (pinned versions)
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
openpdf = { module = "com.github.librepdf:openpdf", version.ref = "openpdf" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "commons-csv" }
jackson-databind-nullable = { module = "org.openapitools:jackson-databind-nullable", version.ref = "jackson-databind-nullable" }

# Test
quarkus-junit5 = { module = "io.quarkus:quarkus-junit5" }
rest-assured = { module = "io.rest-assured:rest-assured" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }

[plugins]
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
