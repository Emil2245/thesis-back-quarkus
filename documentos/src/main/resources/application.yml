quarkus:
  application:
    name: propuestas-documentos
  http:
    port: ${DOCUMENTOS_HTTP_PORT:8081}
    host: 0.0.0.0
    limits:
      max-body-size: 8M

# Set MP_JWT_VERIFY_PUBLICKEY_LOCATION to the dedicated Core service public key.
# Do not configure an empty key location: without a key, auth fails closed and health remains available.
mp:
  jwt:
    verify:
      issuer: core
      audiences: documentos
      clock:
        skew: 0

"%test":
  quarkus:
    http:
      test-port: 0
