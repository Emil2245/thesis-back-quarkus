name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build y tests (spotless + test)
        run: ./gradlew --no-daemon build
      - name: Reportes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

  image:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen (no se publica desde este repo)
        run: docker build -f src/main/docker/Dockerfile -t propuestas-api:ci .
      - name: Trivy (solo reporte)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: propuestas-api:ci
          severity: CRITICAL
          exit-code: '0'
          format: table
