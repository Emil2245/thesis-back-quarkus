name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build and test both Quarkus applications
        run: ./gradlew --no-daemon build -PexcludeKnownResiduals
      - name: Check application boundaries
        run: bash scripts/check-multiproject.sh
      - name: Test reports from both applications
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            documentos/build/reports/tests/

  image:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        include:
          - app: core
            image: propuestas-api
          - app: documentos
            image: propuestas-documentos
    steps:
      - uses: actions/checkout@v7
      - name: Build application image (not published from this repo)
        run: docker build -f ${{ matrix.app }}/src/main/docker/Dockerfile -t ${{ matrix.image }}:ci .
      - name: Trivy (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          severity: CRITICAL
          exit-code: '0'
          format: table
